[project]
name = "ai-creative-copy-agent-backend"
version = "1.0.0"
description = "Multi-agent marketing copy generation API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",   # FastAPI dependencies are declared as defaults by design
    "RUF012", # mutable class attrs are fine on SQLAlchemy/Pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app/agents/*" = ["S101"]      # asserts document workflow ordering invariants
"app/services/ai/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
